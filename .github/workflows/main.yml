name: Build preMediK iOS (.ipa) & Android (.apk)

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build-ios-ipa:
    name: Build iOS .IPA (macOS Xcode)
    runs-on: macos-13
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Capacitor & Sync iOS
        run: |
          if [ -f "preMediK_Android_iOS/package.json" ]; then cd preMediK_Android_iOS; fi
          npm install
          rm -rf ios
          npx cap add ios
          npx cap sync ios
          cd ios/App
          pod install || true

      - name: Compile Unsigned iOS App & Package preMediK-iOS.ipa
        run: |
          if [ -f "preMediK_Android_iOS/package.json" ]; then cd preMediK_Android_iOS; fi
          cd ios/App
          if [ -d "App.xcworkspace" ]; then
            xcodebuild -workspace App.xcworkspace \
              -scheme App \
              -sdk iphoneos \
              -configuration Release \
              -derivedDataPath $RUNNER_TEMP/ios_build \
              CODE_SIGN_IDENTITY="" \
              CODE_SIGNING_REQUIRED=NO \
              CODE_SIGNING_ALLOWED=NO \
              AD_HOC_CODE_SIGNING_ALLOWED=YES \
              clean build
          else
            xcodebuild -project App.xcodeproj \
              -scheme App \
              -sdk iphoneos \
              -configuration Release \
              -derivedDataPath $RUNNER_TEMP/ios_build \
              CODE_SIGN_IDENTITY="" \
              CODE_SIGNING_REQUIRED=NO \
              CODE_SIGNING_ALLOWED=NO \
              AD_HOC_CODE_SIGNING_ALLOWED=YES \
              clean build
          fi
          mkdir -p $RUNNER_TEMP/Payload
          cp -r $RUNNER_TEMP/ios_build/Build/Products/Release-iphoneos/App.app $RUNNER_TEMP/Payload/
          cd $RUNNER_TEMP
          zip -qry preMediK-iOS.ipa Payload

      - name: Upload preMediK-iOS.ipa Artifact
        uses: actions/upload-artifact@v4
        with:
          name: preMediK-iOS-IPA
          path: ${{ runner.temp }}/preMediK-iOS.ipa

  build-android-apk:
    name: Build Android .APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Install Capacitor & Build Android APK
        run: |
          if [ -f "preMediK_Android_iOS/package.json" ]; then cd preMediK_Android_iOS; fi
          npm install
          rm -rf android
          npx cap add android
          npx cap sync android
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug
          cp app/build/outputs/apk/debug/app-debug.apk $RUNNER_TEMP/preMediK-Android.apk

      - name: Upload preMediK-Android.apk Artifact
        uses: actions/upload-artifact@v4
        with:
          name: preMediK-Android-APK
          path: ${{ runner.temp }}/preMediK-Android.apk
