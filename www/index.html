<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#0f766e" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="preMediK" />
  <title>preMediK — Hệ thống Sàng lọc Lao phổi, Viêm phổi & Phân loại Ưu tiên (ResNet50V2-LRMH)</title>
  <script src="https://cdn.tailwindcss.com/3.4.17"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      background-color: #f8fafc;
      color: #0f172a;
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow-x: hidden;
      overscroll-behavior-y: none;
      user-select: none;
    }
    /* Native edge-to-edge mobile app layout (no fake phone frame) */
    .phone-frame-mode, .fullscreen-mobile-mode {
      width: 100%;
      min-height: 100dvh;
      margin: 0;
      border: none;
      border-radius: 0;
      background: #f8fafc;
      box-shadow: none;
      display: flex;
      flex-direction: column;
      position: relative;
      padding-top: env(safe-area-inset-top, 0px);
      padding-bottom: env(safe-area-inset-bottom, 0px);
    }
    .btn-teal {
      background-color: #0d746e;
      color: #ffffff;
      font-weight: 700;
      border-radius: 14px;
      padding: 13px 16px;
      width: 100%;
      text-align: center;
      transition: all 0.15s ease;
      border: 2px solid #0d746e;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }
    .btn-teal:hover:not(:disabled) { background-color: #0b5e59; border-color: #0b5e59; }
    .btn-teal:active:not(:disabled) { transform: scale(0.99); }
    .btn-teal:disabled { opacity: 0.55; cursor: not-allowed; }
    .btn-outline-teal {
      background-color: #ffffff;
      color: #0d746e;
      font-weight: 700;
      border-radius: 14px;
      padding: 12px 16px;
      width: 100%;
      text-align: center;
      transition: all 0.15s ease;
      border: 1.5px solid #0d746e;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }
    .btn-outline-teal:hover:not(:disabled) { background-color: #f0fdfa; }
    .input-box {
      width: 100%;
      background-color: #ffffff;
      border: 1.5px solid #cbd5e1;
      border-radius: 12px;
      padding: 10px 14px;
      font-size: 15px;
      font-weight: 600;
      color: #0f172a;
      outline: none;
      transition: border-color 0.15s ease;
    }
    .input-box:focus { border-color: #0d746e; box-shadow: 0 0 0 3px rgba(13, 116, 110, 0.12); }
    .card-box {
      background: #ffffff;
      border: 1.5px solid #dbe3ec;
      border-radius: 18px;
      padding: 14px 16px;
    }
    /* Custom scrollbar */
    ::-webkit-scrollbar { width: 5px; height: 5px; }
    ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 999px; }
    @media print {
      .no-print { display: none !important; }
      body { background: #fff !important; }
    }
  </style>
</head>
<body>

  <!-- Collapsible Quick-Test Drawer (Hidden by default so the app is 100% pure native mobile screen) -->

      <div class="flex items-center gap-2">
        <span class="font-bold text-xs text-teal-300">Menu Kiểm thử Nhanh (24 Màn hình & Quyền)</span>

      <button id="closeDevDrawerBtn" type="button" class="px-2 py-0.5 rounded bg-slate-800 text-slate-300 text-xs font-bold">Đóng ✕</button>
    </div>
    <div class="grid grid-cols-1 gap-2 text-xs">
      <select id="screenJumpSelect" class="w-full bg-slate-800 text-white border border-slate-600 rounded-lg px-2.5 py-2 text-xs font-medium">

        <option value="UI09">UI09 • Kiểm tra trước khi gửi</option>

        <option value="UI12">UI12 • Ảnh gốc và bản đồ nhiệt Grad-CAM</option>

        <option value="UI17">UI17 • Lịch sử sàng lọc</option>
        <option value="UI18">UI18 • Chi tiết hồ sơ & báo cáo PDF</option>
        <option value="UI19">UI19 • Đồng bộ dữ liệu ngoại tuyến</option>
        <option value="UI20">UI20 • Xử lý xung đột phiên bản</option>
        <option value="UI21">UI21 • Tài khoản và thiết bị</option>
        <option value="UI22">UI22 • Cấu hình sàng lọc (τTB, θ)</option>
        <option value="UI23">UI23 • Quản lý người dùng cơ sở</option>
        <option value="UI24">UI24 • Nhật ký & kiểm soát chất lượng</option>
      </select>
      <div class="flex flex-wrap items-center gap-1.5">
        <select id="roleQuickSelect" class="flex-1 bg-slate-800 text-amber-200 border border-slate-600 rounded-lg px-2 py-1.5 text-xs font-medium">
          <option value="nurse">Điều dưỡng (dieuduong01)</option>
          <option value="doctor">Bác sĩ (bacsi01)</option>
          <option value="admin">Quản trị (quantri01)</option>
          <option value="qc">Kiểm soát CL (kiemsoat01)</option>
        </select>
        <button id="toggleNetworkBtn" type="button" class="px-2.5 py-1.5 rounded-lg font-semibold bg-emerald-700 text-white">● Trực tuyến</button>
        <button id="toggleFrameBtn" type="button" class="hidden">Khung ĐT</button>
        <button id="openInstallGuideBtn" type="button" class="px-2.5 py-1.5 rounded-lg font-semibold bg-teal-600 text-white">📲 Cài Android / iOS</button>
      </div>
    </div>
  </div>

    function parseNum(v) {
      if (v === null || v === undefined || v === '') return NaN;
      return parseFloat(String(v).replace(',', '.'));
    }

    // Bảng 1: Xác định mức ưu tiên lâm sàng LLS
    function computeLLS(c) {
      const v = c.vitals;
      const s = c.symptoms;
      const spo2 = v.spo2Unmeasured ? NaN : parseNum(v.spo2);
      const rr = v.rrUnmeasured ? NaN : parseNum(v.rr);
      const hr = v.hrUnmeasured ? NaN : parseNum(v.hr);
      const temp = v.tempUnmeasured ? NaN : parseNum(v.temp);
      const sbp = v.bpUnmeasured ? NaN : parseNum(v.sbp);

      // Mức 1: Ngừng thở/tuần hoàn; hôn mê; SpO2 < 85%
      if (
        v.cardioResp === 'Ngừng thở/ngừng tuần hoàn' ||
        v.consciousness === 'Hôn mê' ||
        (!isNaN(spo2) && spo2 < 85)
      ) {
        return 1;
      }

      // Mức 2: SpO2 85..<92%; nhịp thở >30 hoặc <10; mạch >130 hoặc <50; tâm thu <90; rối loạn ý thức; ho ra máu lượng nhiều
      if (
        (!isNaN(spo2) && spo2 >= 85 && spo2 < 92) ||
        (!isNaN(rr) && (rr > 30 || rr < 10)) ||
        (!isNaN(hr) && (hr > 130 || hr < 50)) ||
        (!isNaN(sbp) && sbp < 90) ||
        v.consciousness === 'Rối loạn ý thức' ||
        s.hemoptysis === 'Lượng nhiều'
      ) {
        return 2;
      }

      // Mức 3: Khó thở hoặc đau ngực; sốt >= 38.5 kèm triệu chứng hô hấp; ho ra máu lượng ít
      const hasRespSymptom = s.cough === 'Có' || s.dyspnea === 'Có' || s.chestPain === 'Có';
      if (
        s.dyspnea === 'Có' ||
        s.chestPain === 'Có' ||
        (!isNaN(temp) && temp >= 38.5 && hasRespSymptom) ||
        s.hemoptysis === 'Lượng ít'
      ) {
        return 3;
      }

      // Mức 4: Ho kéo dài >= 14 ngày (2 tuần), sốt nhẹ về chiều, sụt cân, ra mồ hôi đêm
      const coughDays = parseNum(s.coughDays);
      if (
        (s.cough === 'Có' && !isNaN(coughDays) && coughDays >= 14) ||
        s.afternoonFever === 'Có' ||
        s.weightLoss === 'Có' ||
        s.nightSweats === 'Có'
      ) {
        return 4;
      }

      // Quy ước: Thiếu dữ liệu không tự xếp mức 5 (giữ mức 4 để bác sĩ đánh giá)
      const hasMissingOrUnknown =
        v.spo2Unmeasured || v.rrUnmeasured || v.hrUnmeasured ||
        v.consciousness === 'Chưa rõ' || s.cough === 'Chưa rõ' ||
        s.dyspnea === 'Chưa rõ' || s.hemoptysis === 'Chưa rõ';
      if (hasMissingOrUnknown) {
        return 4;
      }

      return 5;
    }

    // Bước S6 & Bảng 2: Quyết định nhãn ưu tiên độ nhạy lao & LCLS
    function evaluateAIAndIntegrate(c) {
      c.lls = computeLLS(c);
      if (!c.hasImage || c.imageRejected) {
        c.lcls = null;
        c.proposedLevel = c.lls;
        return;
      }
      // Xác suất mô hình p = (pN, pP, pTB) theo mẫu ảnh
      if (c.imageSampleKey === 'tb') {
        c.probs = { normal: 30, pneumonia: 5, tb: 65 };
      } else if (c.imageSampleKey === 'pneu') {
        c.probs = { normal: 10, pneumonia: 85, tb: 5 };
      } else if (c.imageSampleKey === 'uncertain') {
        c.probs = { normal: 40, pneumonia: 25, tb: 35 };
      } else if (c.imageSampleKey === 'normal') {
        c.probs = { normal: 88, pneumonia: 7, tb: 5 };
      }

      const pN = c.probs.normal / 100;
      const pP = c.probs.pneumonia / 100;
      const pTB = c.probs.tb / 100;
      const maxP = Math.max(pN, pP, pTB);
      const tauTB = parseNum(state.config.tauTB) || 0.35;
      const theta = parseNum(state.config.theta) || 0.60;

      c.uncertain = maxP < theta;
      if (pTB >= tauTB) {
        c.aiLabel = 'Nghi lao phổi';
        c.infectionFlag = true;
        c.lcls = 3;
      } else if (pP >= pN) {
        c.aiLabel = 'Viêm phổi';
        c.infectionFlag = false;
        c.lcls = 3;
      } else {
        c.aiLabel = 'Bình thường';
        c.infectionFlag = false;
        c.lcls = c.uncertain ? 3 : 5;
      }

      if (c.uncertain) {
        c.lcls = Math.min(c.lcls, 3);
      }

      // Công thức (10): L = min(LLS, LCLS)
      c.proposedLevel = Math.min(c.lls, c.lcls);
    }

    function isPriorityPatient(c) {
      if (c.age < 6 || c.age >= 80) return 1;
      if (c.symptoms && c.symptoms.priorityGroups && c.symptoms.priorityGroups.length > 0) {
        if (!c.symptoms.priorityGroups.includes('Không thuộc nhóm đã chọn')) return 1;
      }
      return 0;
    }

        success: 'bg-emerald-50 text-emerald-900 border-emerald-300',

      el.className = `mx-4 mb-2 px-3.5 py-2.5 rounded-xl text-xs font-semibold shadow-sm border transition-all ${styles[type] || styles.info}`;

    function saveUI03Fields(c) {
      const pid = document.getElementById('ui03_patient_id').value.trim();
      const ageVal = parseInt(document.getElementById('ui03_age').value, 10);
      const gender = document.getElementById('ui03_gender').value;
      const dept = document.getElementById('ui03_dept').value;
      const time = document.getElementById('ui03_time').value.trim();
      const consent = document.getElementById('ui03_consent').checked;

      const validPid = pid.length > 0;
      const validAge = !isNaN(ageVal) && ageVal >= 0 && ageVal <= 120;
      document.getElementById('ui03_err_pid').classList.toggle('hidden', validPid);
      document.getElementById('ui03_err_age').classList.toggle('hidden', validAge);
      document.getElementById('ui03_err_consent').classList.toggle('hidden', consent);

      if (!validPid || !validAge || !consent) return false;

      c.patientId = pid;
      c.age = ageVal;
      c.gender = gender;
      c.dept = dept;
      c.intakeTime = time || '04/11/2026 • 09:30';
      c.consentChecked = consent;

      // Auto-suggest priority group if age < 6 or >= 80
      if (ageVal < 6 && !c.symptoms.priorityGroups.includes('Trẻ em dưới 6 tuổi')) {
        c.symptoms.priorityGroups.push('Trẻ em dưới 6 tuổi');
      } else if (ageVal >= 80 && !c.symptoms.priorityGroups.includes('Người từ 80 tuổi trở lên')) {
        c.symptoms.priorityGroups.push('Người từ 80 tuổi trở lên');
      }
      saveState();
      return true;
    }

        newCase.confirmedLevel = null;

    function saveUI07Vitals(c) {
      const v = c.vitals;
      const errEl = document.getElementById('ui07_err_msg');
      if (!v.spo2Unmeasured) {
        const spo2 = parseNum(document.getElementById('ui07_spo2').value);
        const rr = parseNum(document.getElementById('ui07_rr').value);
        const hr = parseNum(document.getElementById('ui07_hr').value);
        const tempRaw = document.getElementById('ui07_temp').value.trim();
        const temp = parseNum(tempRaw);
        const sbp = parseNum(document.getElementById('ui07_sbp').value);
        const dbp = parseNum(document.getElementById('ui07_dbp').value);

        if ([spo2, rr, hr, temp, sbp, dbp].some(x => x === 0)) {
          errEl.textContent = 'Không dùng số 0 thay cho giá trị thiếu. Hãy bấm nút "Đánh dấu Chưa đo".';
          errEl.classList.remove('hidden');
          return false;
        }
        if (isNaN(spo2) || spo2 < 30 || spo2 > 100) {
          errEl.textContent = 'SpO2 phải nằm trong khoảng 30% – 100%.';
          errEl.classList.remove('hidden');
          return false;
        }
        v.spo2 = spo2;
        v.rr = isNaN(rr) ? 18 : rr;
        v.hr = isNaN(hr) ? 82 : hr;
        v.temp = tempRaw || '37,2';
        v.sbp = isNaN(sbp) ? 120 : sbp;
        v.dbp = isNaN(dbp) ? 80 : dbp;
      } else {
        const reasonInput = document.getElementById('ui07_unmeasured_reason');
        v.unmeasuredReason = reasonInput ? reasonInput.value.trim() : 'Chưa đo';
      }
      v.consciousness = document.getElementById('ui07_consciousness').value;
      v.cardioResp = document.getElementById('ui07_cardio').value;
      errEl.classList.add('hidden');
      c.lls = computeLLS(c);
      saveState();
      return true;
    }

        state.analysisTimer = null;

        navigateTo('UI06');
        return;

      evaluateAIAndIntegrate(c);
      c.syncStatus = 'Đã đồng bộ';
      addAuditLog(
        'Hoàn tất phân tích',
        c.id,
        `Mô hình ${state.config.modelVersion} • Rule ${state.config.clinicalRuleSet.split('•')[0].trim()}`,
        `Kết quả: ${c.aiLabel} (pN=${c.probs.normal}%, pP=${c.probs.pneumonia}%, pTB=${c.probs.tb}%). LLS=${c.lls}, LCLS=${c.lcls} → L=${c.proposedLevel}.`
      );
      if (c.uncertain) {
        navigateTo('UI13');
      } else {
        navigateTo('UI11');
      }
    }

      if (!state.analysisTimer) {

          if (state.currentUI !== 'UI10') {
            clearInterval(state.analysisTimer);
            state.analysisTimer = null;
            return;
          }
          if (state.analysisStep < 4) {
            state.analysisStep++;
            renderCurrentScreen();
          } else {

    function bindUI14(c) {
      document.getElementById('ui14_back').addEventListener('click', () => goBack('UI11'));

      document.getElementById('ui14_confirm_btn').addEventListener('click', () => {
        const evalVal = document.getElementById('ui14_eval_select').value;
        const lvlVal = parseInt(document.getElementById('ui14_level_select').value, 10);
        const reasonVal = document.getElementById('ui14_reason').value.trim();
        const chk = document.getElementById('ui14_reviewed_chk').checked;

        document.getElementById('ui14_err_chk').classList.toggle('hidden', chk);
        const changed = (lvlVal !== c.proposedLevel) || (evalVal !== c.aiLabel);
        const validReason = !changed || reasonVal.length >= 3;
        document.getElementById('ui14_err_reason').classList.toggle('hidden', validReason);

        if (!chk || !validReason) return;

        if (c.syncStatus === 'Cần xử lý xung đột') {
          showToast('Phát hiện xung đột phiên bản trên hồ sơ này! Chuyển sang UI20.', 'warn');
          navigateTo('UI20');
          return;
        }

        c.doctorEval = evalVal;
        c.confirmedLevel = lvlVal;
        c.doctorReason = reasonVal || 'Giữ đề xuất của hệ thống';
        c.doctorConfirmed = true;
        c.doctorUser = 'BS DEMO';
        if (c.queueStatus === 'Chờ bác sĩ') c.queueStatus = 'Đang chờ';
        c.version = (c.version || 1) + 1;
        c.history.push({
          time: '09:41',
          title: `Bác sĩ xác nhận (v${c.version})`,
          actor: 'BS DEMO (bacsi01)',
          detail: `Đánh giá: ${evalVal} • Mức xác nhận: ${lvlVal}. Lý do: ${c.doctorReason}`

        navigateTo(state.returnScreenForUI14 || 'UI15');
      });
    }

    // -------------------------------------------------------------------------
    // UI15: Hàng đợi tiếp nhận (Sắp xếp theo (L, -u, t))
    // -------------------------------------------------------------------------
    function renderUI15() {
      // Filter and sort according to (L, -u, t)
      const filtered = state.cases.filter(item => {
        const effLevel = item.confirmedLevel || item.proposedLevel || item.lls || 3;
        if (state.queueFilterLevel !== 'ALL' && String(effLevel) !== String(state.queueFilterLevel)) return false;
        if (state.queueFilterStatus !== 'ALL') {
          if (state.queueFilterStatus === 'Chờ bác sĩ') {
            return !item.doctorConfirmed || item.queueStatus === 'Chờ bác sĩ';
          }
          if (state.queueFilterStatus === 'Đang chờ') {
            return item.queueStatus === 'Đang chờ' || item.queueStatus === 'Chờ bác sĩ';
          }
          return item.queueStatus === state.queueFilterStatus;
        }
        return true;
      }).sort((a, b) => {
        const lA = a.confirmedLevel || a.proposedLevel || a.lls || 3;
        const lB = b.confirmedLevel || b.proposedLevel || b.lls || 3;
        if (lA !== lB) return lA - lB; // L nhỏ hơn xếp trước
        const uA = isPriorityPatient(a);
        const uB = isPriorityPatient(b);
        if (uA !== uB) return uB - uA; // -u: đối tượng ưu tiên xếp trước
        return (b.waitMinutes || 0) - (a.waitMinutes || 0); // t: chờ lâu hơn xếp trước
      });

      return `
        <div class="pt-1 space-y-3.5">
          <div>
            <h1 class="text-xl font-extrabold text-slate-900">Hàng đợi tiếp nhận</h1>

              Khám hô hấp • ${state.online ? `Trực tuyến 09:41` : `Mất mạng • Đang xem bản lưu`}
            </p>
          </div>

          ${!state.online ? `
            <div class="px-3 py-2 rounded-xl bg-amber-50 border border-amber-300 text-amber-900 text-xs font-bold">
              Đang mất mạng: Chỉ xem bản lưu cục bộ, không cho gọi lượt từ danh sách cũ.
            </div>
          ` : ''}

          <!-- Filter Bar -->
          <div class="grid grid-cols-2 gap-2 bg-emerald-50/90 p-2 rounded-xl border border-emerald-200">
            <select id="ui15_filter_level" class="bg-transparent text-xs font-extrabold text-emerald-950 focus:outline-none">
              <option value="ALL" ${state.queueFilterLevel === 'ALL' ? 'selected' : ''}>Tất cả mức ▾</option>
              <option value="1" ${state.queueFilterLevel === '1' ? 'selected' : ''}>Mức 1 (Cấp cứu)</option>
              <option value="2" ${state.queueFilterLevel === '2' ? 'selected' : ''}>Mức 2 (Rất khẩn)</option>
              <option value="3" ${state.queueFilterLevel === '3' ? 'selected' : ''}>Mức 3 (Khẩn)</option>
              <option value="4" ${state.queueFilterLevel === '4' ? 'selected' : ''}>Mức 4 (Bán khẩn)</option>
              <option value="5" ${state.queueFilterLevel === '5' ? 'selected' : ''}>Mức 5 (Không khẩn)</option>
            </select>

            <select id="ui15_filter_status" class="bg-transparent text-xs font-extrabold text-emerald-950 focus:outline-none">
              <option value="Đang chờ" ${state.queueFilterStatus === 'Đang chờ' ? 'selected' : ''}>Đang chờ ▾</option>
              <option value="Chờ bác sĩ" ${state.queueFilterStatus === 'Chờ bác sĩ' ? 'selected' : ''}>Chờ bác sĩ ▾</option>

    // -------------------------------------------------------------------------

            <button id="ui16_sim_taken" type="button" class="text-[11px] font-semibold text-amber-800 bg-amber-50 border border-amber-200 px-2 py-1 rounded-lg">

          <div class="px-3.5 py-2.5 rounded-xl border font-extrabold text-xs ${levelBadgeClass(lvl)}">

            <div class="text-sm font-medium text-slate-800">Lý do: ${reasonText}</div>

              <span>Mở phiếu tái đánh giá ›</span>

              <button id="ui16_finish_exam_btn" type="button" class="btn-teal">Hoàn tất tiếp nhận › Về hàng đợi</button>
            `}
            <button id="ui16_open_or_reassess" type="button" class="btn-outline-teal">Mở hồ sơ hoặc tái đánh giá</button>
          </div>

      `;

    function bindUI16(c) {
      document.getElementById('ui16_back').addEventListener('click', () => goBack('UI15'));

      document.getElementById('ui16_reassess_card').addEventListener('click', () => {
        c.version = (c.version || 1) + 1;
        showToast(`Bắt đầu lần tái đánh giá mới (v${c.version}) cho mã lượt ${c.id}.`, 'info');
        navigateTo('UI07');
      });

      document.getElementById('ui16_sim_taken').addEventListener('click', () => {
        showToast(`Lượt ${c.id} vừa được nhân viên y tế khác tiếp nhận! Đang tải lại hàng đợi...`, 'warn');
        navigateTo('UI15');
      });

      const callBtn = document.getElementById('ui16_call_btn');
      if (callBtn) {
        callBtn.addEventListener('click', () => {
          if (!state.online) {
            showToast('Đang mất mạng: Không được gọi lượt từ danh sách lưu cục bộ cũ.', 'error');
            return;
          }
          c.queueStatus = 'Đã gọi';

            time: '09:41',

            detail: `Đã gọi người bệnh ${c.patientId} (Mức ${c.confirmedLevel || c.proposedLevel}).`
          });
          showToast(`Đã gọi người bệnh ${c.patientId} (${c.id}).`, 'success');
          renderCurrentScreen();
        });

      if (startExamBtn) {
        startExamBtn.addEventListener('click', () => {
          c.queueStatus = 'Đang khám';
          showToast(`Đang khám cho người bệnh ${c.patientId}.`, 'info');
          renderCurrentScreen();
        });
      }

      const finishExamBtn = document.getElementById('ui16_finish_exam_btn');
      if (finishExamBtn) {
        finishExamBtn.addEventListener('click', () => {
          c.queueStatus = 'Hoàn tất';
          c.history.push({
            time: '09:42',
            title: 'Hoàn tất tiếp nhận',
            actor: state.currentUser.username,
            detail: 'Đã hoàn tất tiếp nhận và chuyển xử trí chuyên khoa.'
          });

          navigateTo('UI15');
        });
      }

      document.getElementById('ui16_open_or_reassess').addEventListener('click', () => {
        openModal(
          `Thao tác với lượt ${c.id}`,
          `<p class="text-xs text-slate-600">Chọn thao tác tiếp theo cho người bệnh <strong>${c.patientId}</strong>:</p>`,
          `<button id="modalOpenRecordBtn" type="button" class="btn-teal">Xem chi tiết hồ sơ (UI18)</button>
           <button id="modalStartReassessBtn" type="button" class="btn-outline-teal">Tạo phiếu tái đánh giá mới (UI07)</button>`
        );
        document.getElementById('modalOpenRecordBtn').addEventListener('click', () => {
          closeModal();
          navigateTo('UI18');
        });
        document.getElementById('modalStartReassessBtn').addEventListener('click', () => {
          c.version = (c.version || 1) + 1;
          closeModal();
          navigateTo('UI07');
        });
      });
    }

    // -------------------------------------------------------------------------
    // UI17: Lịch sử sàng lọc
    // -------------------------------------------------------------------------
    function renderUI17() {
      const q = (state.historySearch || '').trim().toLowerCase();
      const filtered = state.cases.filter(item => {
        if (q && !item.id.toLowerCase().includes(q) && !item.patientId.toLowerCase().includes(q)) return false;
        if (state.historyFromDate && item.dateISO < state.historyFromDate) return false;
        if (state.historyToDate && item.dateISO > state.historyToDate) return false;
        if (state.historyResultFilter === 'TB' && !item.aiLabel.includes('lao')) return false;
        if (state.historyResultFilter === 'PNEU' && !item.aiLabel.includes('Viêm phổi')) return false;
        if (state.historyResultFilter === 'UNCERTAIN' && !item.uncertain) return false;
        if (state.historyResultFilter === 'CONFIRMED' && !item.doctorConfirmed) return false;
        return true;
      });

      return `
        <div class="pt-1 space-y-3.5">
          <div>
            <h1 class="text-xl font-extrabold text-slate-900">Lịch sử sàng lọc</h1>
            <p class="text-xs text-slate-500 mt-0.5">Chỉ dữ liệu trong phạm vi được cấp</p>
          </div>

          <div class="space-y-2.5">
            <div>
              <label class="block text-xs font-semibold text-slate-600 mb-1">Tìm theo mã người bệnh hoặc mã lượt</label>
              <input id="ui17_search" type="text" value="${state.historySearch}" placeholder="VD: NB-DEMO hoặc LT-DEMO" class="input-box" />
            </div>

            <div class="grid grid-cols-2 gap-2.5">
              <div>
                <label class="block text-xs font-semibold text-slate-600 mb-1">Từ ngày</label>
                <input id="ui17_from" type="date" value="${state.historyFromDate}" class="input-box text-xs" />
              </div>
              <div>
                <label class="block text-xs font-semibold text-slate-600 mb-1">Đến ngày</label>
                <input id="ui17_to" type="date" value="${state.historyToDate}" class="input-box text-xs" />
              </div>
            </div>
            <p id="ui17_err_date" class="hidden text-xs font-semibold text-rose-600">Từ ngày không được sau Đến ngày.</p>

            <div>
              <label class="block text-xs font-semibold text-slate-600 mb-1">Bộ lọc kết quả</label>
              <select id="ui17_filter" class="input-box">
                <option value="ALL" ${state.historyResultFilter === 'ALL' ? 'selected' : ''}>Tất cả • Mức 1 đến 5</option>
                <option value="TB" ${state.historyResultFilter === 'TB' ? 'selected' : ''}>Nghi lao phổi</option>
                <option value="PNEU" ${state.historyResultFilter === 'PNEU' ? 'selected' : ''}>Viêm phổi</option>
                <option value="UNCERTAIN" ${state.historyResultFilter === 'UNCERTAIN' ? 'selected' : ''}>Kết quả chưa chắc chắn</option>
                <option value="CONFIRMED" ${state.historyResultFilter === 'CONFIRMED' ? 'selected' : ''}>Đã được bác sĩ xác nhận</option>
              </select>
            </div>
          </div>

          <div class="space-y-2.5 pt-1">
            ${filtered.length === 0 ? `
              <div class="card-box text-center py-8 text-xs text-slate-500">
                Không tìm thấy hồ sơ sàng lọc nào khớp với điều kiện tra cứu.
              </div>
            ` : filtered.map(item => {
              const lvl = item.confirmedLevel || item.proposedLevel || item.lls || 3;
              const shortDate = item.intakeTime.split('•')[0].trim().slice(0, 5);
              const shortLabel = item.uncertain ? 'Chưa chắc chắn' : (item.infectionFlag ? 'Nghi lao' : item.aiLabel);
              return `
                <button type="button" data-hist-id="${item.id}" class="hist-row-btn card-box w-full text-left hover:border-teal-600 transition">
                  <div class="font-extrabold text-base text-slate-900">${item.id}</div>
                  <div class="text-xs text-slate-600 mt-0.5">${shortDate} • ${shortLabel} • Mức ${lvl} (${item.patientId})</div>
                </button>
              `;
            }).join('')}
          </div>
        </div>
      `;
    }

    function bindUI17() {
      document.getElementById('ui17_search').addEventListener('input', (e) => {
        state.historySearch = e.target.value;
        renderCurrentScreen();
        const input = document.getElementById('ui17_search');
        input.focus();
        input.setSelectionRange(input.value.length, input.value.length);
      });

      const checkDates = () => {
        const f = document.getElementById('ui17_from').value;
        const t = document.getElementById('ui17_to').value;
        if (f && t && f > t) {
          document.getElementById('ui17_err_date').classList.remove('hidden');
          return;
        }
        document.getElementById('ui17_err_date').classList.add('hidden');
        state.historyFromDate = f;
        state.historyToDate = t;
        renderCurrentScreen();
      };

      document.getElementById('ui17_from').addEventListener('change', checkDates);
      document.getElementById('ui17_to').addEventListener('change', checkDates);

      document.getElementById('ui17_filter').addEventListener('change', (e) => {
        state.historyResultFilter = e.target.value;
        renderCurrentScreen();
      });

      document.querySelectorAll('.hist-row-btn').forEach(btn => {
        btn.addEventListener('click', () => {
          state.activeCaseId = btn.getAttribute('data-hist-id');
          navigateTo('UI18');
        });
      });
    }

          </div>
        </div>
      `;
    }

           <div>
             <label class="block font-semibold text-slate-600 mb-1">Khoa / Phạm vi</label>
             <select id="dlg_usr_dept" class="input-box text-xs">
               <option value="Khám hô hấp" ${u.dept === 'Khám hô hấp' ? 'selected' : ''}>Khám hô hấp</option>
               <option value="Khoa Cấp cứu" ${u.dept === 'Khoa Cấp cứu' ? 'selected' : ''}>Khoa Cấp cứu</option>
               <option value="Nội tổng hợp" ${u.dept === 'Nội tổng hợp' ? 'selected' : ''}>Nội tổng hợp</option>
             </select>
           </div>
           <div>
             <label class="block font-semibold text-slate-600 mb-1">Trạng thái</label>
             <select id="dlg_usr_status" class="input-box text-xs">
               <option value="Đang hoạt động" ${u.status === 'Đang hoạt động' ? 'selected' : ''}>Đang hoạt động</option>
               <option value="Đã khóa" ${u.status === 'Đã khóa' ? 'selected' : ''}>Đã khóa</option>
             </select>
           </div>
         </div>`,
        `<button id="dlgSaveUserBtn" type="button" class="btn-teal">Lưu thông tin & Ghi nhật ký</button>`
      );

      document.getElementById('dlgSaveUserBtn').addEventListener('click', () => {
        const nameVal = document.getElementById('dlg_usr_name').value.trim();
        const roleVal = document.getElementById('dlg_usr_role').value;
        const deptVal = document.getElementById('dlg_usr_dept').value;
        const statusVal = document.getElementById('dlg_usr_status').value;

        if (!nameVal) {
          showToast('Vui lòng nhập tên tài khoản.', 'error');
          return;
        }
        if (nameVal === state.currentUser.username && statusVal === 'Đã khóa') {
          showToast('Không được tự khóa tài khoản đang đăng nhập của chính mình.', 'error');
          return;
        }
        const roleLabels = {
          nurse: 'Điều dưỡng',
          doctor: 'Bác sĩ',
          qc: 'Kiểm soát chất lượng • Chỉ đọc',
          admin: 'Quản trị hệ thống'
        };
        if (isEdit) {
          u.role = roleVal;
          u.roleLabel = roleLabels[roleVal];
          u.dept = deptVal;
          u.status = statusVal;
        } else {
          state.users.push({
            username: nameVal,
            empId: 'NV-' + (state.users.length + 1),
            role: roleVal,
            roleLabel: roleLabels[roleVal],
            dept: deptVal,
            status: statusVal
          });
        }
        addAuditLog('Phân quyền tài khoản', nameVal, `${nameVal} • ${roleLabels[roleVal]} (${statusVal})`, `Cập nhật tài khoản ${nameVal} tại khoa ${deptVal}.`);
        closeModal();
        showToast(`Đã lưu tài khoản ${nameVal} và ghi nhận vào nhật ký (UI24).`, 'success');
        renderCurrentScreen();
      });
    }

    function bindUI23() {
      document.getElementById('ui23_back').addEventListener('click', () => goBack('UI21'));
      document.getElementById('ui23_search').addEventListener('input', (e) => {
        state.userSearchQuery = e.target.value;
        renderCurrentScreen();
        const el = document.getElementById('ui23_search');
        el.focus();
        el.setSelectionRange(el.value.length, el.value.length);
      });
      document.querySelectorAll('.usr-row-btn').forEach(btn => {
        btn.addEventListener('click', () => {
          const uname = btn.getAttribute('data-usr');
          const found = state.users.find(x => x.username === uname);
          if (found) openUserDialog(found);
        });
      });
      document.getElementById('ui23_create_user_btn').addEventListener('click', () => openUserDialog(null));
    }

    // -------------------------------------------------------------------------
    // UI24: Nhật ký và kiểm soát chất lượng
    // -------------------------------------------------------------------------
    function renderUI24() {
      const logs = state.auditLogs.filter(l => {
        if (state.auditTypeFilter !== 'Tất cả' && l.type !== state.auditTypeFilter) return false;
        return true;
      });

      return `
        <div class="pt-1 space-y-3.5">
          <div>
            <button id="ui24_back" type="button" class="text-base font-extrabold text-slate-900 flex items-center gap-1.5">
              <span>‹</span> <span>Nhật ký và kiểm soát chất lượng</span>
            </button>
            <p class="text-xs text-slate-500 mt-0.5">Chỉ người có quyền • Không chứa định danh</p>
          </div>

          <div class="grid grid-cols-2 gap-3">
            <div>
              <label class="block text-xs font-semibold text-slate-600 mb-1">Ngày</label>
              <input id="ui24_date" type="date" value="${state.auditDateFilter}" class="input-box text-xs" />
            </div>
            <div>
              <label class="block text-xs font-semibold text-slate-600 mb-1">Loại sự kiện</label>
              <select id="ui24_type" class="input-box text-xs">
                <option value="Tất cả" ${state.auditTypeFilter === 'Tất cả' ? 'selected' : ''}>Tất cả ▾</option>
                <option value="Bác sĩ xác nhận" ${state.auditTypeFilter === 'Bác sĩ xác nhận' ? 'selected' : ''}>Bác sĩ xác nhận</option>
                <option value="Hoàn tất phân tích" ${state.auditTypeFilter === 'Hoàn tất phân tích' ? 'selected' : ''}>Hoàn tất phân tích</option>
                <option value="Tạo lượt" ${state.auditTypeFilter === 'Tạo lượt' ? 'selected' : ''}>Tạo lượt</option>
              </select>
            </div>
          </div>

          <div class="space-y-2.5">
            ${logs.map(l => `
              <button type="button" data-log-id="${l.id}" class="log-row-btn card-box w-full text-left hover:border-teal-600 transition">
                <div class="flex items-center justify-between">
                  <span class="font-extrabold text-sm text-slate-900">${l.title}</span>
                  ${l.markedForEval ? '<span class="text-[10px] font-bold bg-teal-100 text-teal-900 px-2 py-0.5 rounded-md">Đã chọn đánh giá CL</span>' : ''}
                </div>
                <div class="text-xs text-slate-600 mt-0.5">${l.subtitle}</div>
              </button>
            `).join('')}
          </div>

          <p class="text-xs text-slate-500 leading-relaxed">
            Dữ liệu xác nhận chỉ được tuyển vào bộ đánh giá hoặc huấn luyện qua bước xét duyệt riêng.
          </p>

          <div class="pt-1">
            <button id="ui24_filter_btn" type="button" class="btn-outline-teal">Lọc và xem chi tiết sự kiện</button>
          </div>
        </div>
      `;
    }

    function openAuditDetailModal(logItem) {
      openModal(
        `Chi tiết sự kiện • ${logItem.id}`,
        `<div class="space-y-2 text-xs">
           <div><strong>Thời điểm:</strong> ${logItem.date} • ${logItem.time}</div>
           <div><strong>Nhóm thao tác:</strong> ${logItem.type}</div>
           <div><strong>Đối tượng / Mã lượt:</strong> ${logItem.caseId}</div>
           <div><strong>Người thao tác:</strong> ${logItem.actor}</div>
           <div class="p-2.5 rounded-lg bg-slate-50 border border-slate-200">${logItem.detail}</div>
           <label class="flex items-center gap-2 pt-2 cursor-pointer">
             <input id="dlg_mark_eval" type="checkbox" ${logItem.markedForEval ? 'checked' : ''} class="w-4 h-4 accent-[#0d746e]" />
             <span class="font-semibold text-slate-800">Đánh dấu ca đã xác nhận vào bộ kiểm định chất lượng (Không tự đưa vào huấn luyện mô hình)</span>
           </label>
         </div>`,
        `<button id="dlgSaveLogMarkBtn" type="button" class="btn-teal">Lưu đánh dấu kiểm soát chất lượng</button>`
      );
      document.getElementById('dlgSaveLogMarkBtn').addEventListener('click', () => {
        logItem.markedForEval = document.getElementById('dlg_mark_eval').checked;
        closeModal();
        showToast('Đã cập nhật trạng thái đánh dấu kiểm soát chất lượng.', 'success');
        renderCurrentScreen();
      });
    }

    function bindUI24() {
      document.getElementById('ui24_back').addEventListener('click', () => goBack('UI21'));
      document.getElementById('ui24_date').addEventListener('change', (e) => {
        state.auditDateFilter = e.target.value;
        renderCurrentScreen();
      });
      document.getElementById('ui24_type').addEventListener('change', (e) => {
        state.auditTypeFilter = e.target.value;
        renderCurrentScreen();
      });
      document.querySelectorAll('.log-row-btn').forEach(btn => {
        btn.addEventListener('click', () => {
          const id = btn.getAttribute('data-log-id');
          const found = state.auditLogs.find(x => x.id === id);
          if (found) openAuditDetailModal(found);
        });
      });
      document.getElementById('ui24_filter_btn').addEventListener('click', () => {
        if (state.auditLogs.length > 0) openAuditDetailModal(state.auditLogs[0]);
      });
    }

    // =========================================================================
    // 4. TOP EVALUATOR CONTROLS & INSTALL GUIDE MODAL
    // =========================================================================
    document.getElementById('closeModalBtn').addEventListener('click', closeModal);
    document.getElementById('openDevDrawerBtn').addEventListener('click', () => {
      document.getElementById('devQuickDrawer').classList.remove('hidden');
    });
    document.getElementById('closeDevDrawerBtn').addEventListener('click', () => {
      document.getElementById('devQuickDrawer').classList.add('hidden');
    });

    document.getElementById('screenJumpSelect').addEventListener('change', (e) => {
      state.loggedIn = true;
      navigateTo(e.target.value);
    });

    document.getElementById('roleQuickSelect').addEventListener('change', (e) => {
      const r = e.target.value;
      const found = state.users.find(u => u.role === r);
      if (found) {
        state.currentUser = found;
        showToast(`Đã chuyển sang vai trò: ${found.roleLabel} (${found.username})`, 'info');
        renderCurrentScreen();
      }
    });

    document.getElementById('toggleNetworkBtn').addEventListener('click', () => {
      state.online = !state.online;
      showToast(
        state.online
          ? 'Đã kết nối mạng trở lại (Trực tuyến).'
          : 'Đã chuyển sang chế độ Mất mạng (Kiểm thử lưu cục bộ & đồng bộ UI19).',
        state.online ? 'success' : 'warn'
      );
      renderCurrentScreen();
    });

    document.getElementById('toggleFrameBtn').addEventListener('click', () => {
      state.phoneFrameMode = !state.phoneFrameMode;
      const shell = document.getElementById('phoneShell');
      const btn = document.getElementById('toggleFrameBtn');
      if (state.phoneFrameMode) {
        shell.className = 'phone-frame-mode no-print';
        btn.textContent = 'Khung ĐT';
      } else {
        shell.className = 'fullscreen-mobile-mode no-print';
        btn.textContent = 'Toàn màn hình';
      }
    });

    document.querySelectorAll('.nav-tab-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        const target = btn.getAttribute('data-nav');
        if (!state.loggedIn && state.currentUI === 'UI01') {
          showToast('Vui lòng đăng nhập cơ sở y tế trước (hoặc bấm nút Đăng nhập).', 'warn');
          return;
        }
        navigateTo(target);
      });
    });

    document.getElementById('openInstallGuideBtn').addEventListener('click', () => {
      openModal(
        'Hướng dẫn cài đặt trên Android & iOS',
        `<div class="space-y-3 text-xs leading-relaxed">
           <div class="p-3 rounded-xl bg-teal-50 border border-teal-200">
             <div class="font-bold text-teal-950 mb-1">Cách 1: Cài đặt trực tiếp lên màn hình chính (PWA Mobile App)</div>
             <ul class="list-disc pl-4 space-y-1 text-slate-700">
               <li><strong>Trên iPhone / iPad (iOS Safari):</strong> Mở tệp ứng dụng hoặc đường dẫn web trên Safari → Bấm nút <strong>Chia sẻ (Share)</strong> → Chọn <strong>Thêm vào Màn hình chính (Add to Home Screen)</strong>. Ứng dụng sẽ chạy toàn màn hình độc lập và lưu dữ liệu ngoại tuyến.</li>
               <li><strong>Trên Android (Chrome / Edge):</strong> Mở trên trình duyệt → Bấm biểu tượng menu <strong>⋮</strong> → Chọn <strong>Cài đặt ứng dụng (Install App / Thêm vào Màn hình chính)</strong>.</li>
             </ul>
           </div>
           <div class="p-3 rounded-xl bg-slate-100 border border-slate-200">
             <div class="font-bold text-slate-900 mb-1">Cách 2: Biên dịch gói cài đặt Native (.apk / .ipa) từ tệp ZIP đính kèm</div>
             <p class="text-slate-600">Gói mã nguồn <code>preMediK_Android_iOS_Project.zip</code> đi kèm đã tích hợp sẵn cấu hình <strong>Capacitor (Android Gradle &amp; iOS Xcode)</strong>, <strong>React Native Expo</strong> và mô-đun suy luận <strong>ResNet50V2 – LRMH</strong>:</p>
             <pre class="bg-slate-900 text-teal-300 p-2 rounded-lg overflow-x-auto mt-1 text-[10px]">npm install
npx cap add android
npx cap add ios
npx cap sync
npx cap open android   # Xuất file .apk / .aab
npx cap open ios       # Xuất file .ipa trên Xcode</pre>
           </div>
         </div>`,
        `<button id="closeInstallModalBtn" type="button" class="btn-teal">Đã hiểu</button>`
      );
      document.getElementById('closeInstallModalBtn').addEventListener('click', closeModal);
    });

    // Initial render
    window.addEventListener('DOMContentLoaded', () => {
      renderCurrentScreen();
    });
  </script>
</body>
</html>
